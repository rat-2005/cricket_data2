<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batter Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --glass-border: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
            background-attachment: fixed;
        }

        h1, h2, h3 {
            font-family: 'Outfit', sans-serif;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .logo h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .nav-links a {
            padding: 0.75rem 1.5rem;
            border-radius: 100px;
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text-primary);
            background: var(--surface-hover);
        }
        
        .nav-links a.active {
            background: var(--accent-gradient);
        }

        .search-container {
            max-width: 600px;
            margin: 4rem auto;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 1.5rem 1.5rem 1.5rem 4rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .search-container input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
            background: rgba(0, 0, 0, 0.6);
        }

        .search-icon {
            position: absolute;
            left: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        .search-results {
            position: absolute;
            top: calc(100% + 1rem);
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            display: none;
            z-index: 100;
        }

        .search-results.active {
            display: block;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .search-item {
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--text-primary);
            text-decoration: none;
            border-bottom: 1px solid var(--glass-border);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .search-item:last-child {
            border-bottom: none;
        }

        .search-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Dashboard Styles */
        .dashboard {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
        }

        .filters-sidebar {
            background: var(--surface-color);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            height: fit-content;
        }

        .filter-group {
            margin-bottom: 1.5rem;
        }

        .filter-group:last-child {
            margin-bottom: 0;
        }

        .filter-group label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .filter-group select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            appearance: none;
        }
        
        .filter-group select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--surface-color);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.5rem;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,255,255,0.1);
        }

        .stat-card i {
            font-size: 2rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .stat-card h3 {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .stat-card p {
            font-size: 2.5rem;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            margin: 0;
        }
        
        .player-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .player-header h2 {
            font-size: 2.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <a href="/" style="text-decoration: none;"><h1>Cricket Analytics</h1></a>
            </div>
            <div class="nav-links" style="display: flex; gap: 1rem;">
                <a href="/batter" class="active"><i class="fas fa-baseball-bat-ball"></i> Batter Analytics</a>
                <a href="/bowler"><i class="fas fa-bolt"></i> Bowler Analytics</a>
                <a href="/faceoff"><i class="fas fa-people-arrows"></i> Face-off</a>
                <a href="/player"><i class="fas fa-user"></i> Player Profile</a>
            </div>
        </header>

        {% if not athlete_id %}
        <!-- Search State -->
        <div class="search-container">
            <h2 style="text-align: center; margin-bottom: 2rem; font-size: 2rem;">Search for a Batter</h2>
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="playerSearch" placeholder="Type a player name..." autocomplete="off">
            <div id="searchResults" class="search-results"></div>
        </div>
        
        <script>
            const searchInput = document.getElementById('playerSearch');
            const searchResults = document.getElementById('searchResults');
            let searchTimeout;

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim();
                clearTimeout(searchTimeout);
                
                if (query.length < 1) {
                    searchResults.classList.remove('active');
                    return;
                }
                
                searchResults.innerHTML = '<div style="padding: 1rem; color: var(--text-secondary); text-align: center;"><i class="fas fa-spinner fa-spin"></i> Searching...</div>';
                searchResults.classList.add('active');

                searchTimeout = setTimeout(async () => {
                    try {
                        const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                        const data = await response.json();
                        
                        if (data.length > 0) {
                            searchResults.innerHTML = data.map(p => {
                                const safeName = (p.full_name || '').replace(/'/g, "\\'");
                                return `
                                <a href="/batter?id=${p.id}" class="search-item">
                                    <div>
                                        <div style="font-weight: 600; font-family: 'Outfit', sans-serif;">${p.full_name}</div>
                                        <div style="font-size: 0.8rem; color: var(--text-secondary);">${p.country_code || 'Unknown'}</div>
                                    </div>
                                </a>
                                `;
                            }).join('');
                        } else {
                            searchResults.innerHTML = '<div style="padding: 1rem; color: var(--text-secondary); text-align: center;">No players found</div>';
                        }
                    } catch (err) {
                        searchResults.innerHTML = '<div style="padding: 1rem; color: #ef4444; text-align: center;">Error loading results</div>';
                        console.error('Search failed:', err);
                    }
                }, 300);
            });

            document.addEventListener('click', (e) => {
                if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                    searchResults.classList.remove('active');
                }
            });
        </script>
        
        {% else %}
        <!-- Analytics State -->
        <div id="playerHeader" class="player-header">
            <!-- Populated via JS -->
        </div>

        <div class="dashboard">
            <!-- Cascading Dropdowns -->
            <div class="filters-sidebar">
                <h3><i class="fas fa-filter"></i> Filters</h3>
                <hr style="border: 0; border-top: 1px solid var(--glass-border); margin: 1rem 0;">
                
                <div class="filter-group">
                    <label>Format</label>
                    <select id="filterFormat">
                        <option value="All">All Formats</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label>League / Competition</label>
                    <select id="filterLeague">
                        <option value="All">All Leagues</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label>Opponent Team</label>
                    <select id="filterOpponent">
                        <option value="All">All Opponents</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label>Match Phase</label>
                    <select id="filterPhase">
                        <option value="All">All Phases</option>
                        <option value="Powerplay">Powerplay (1-6)</option>
                        <option value="Middle">Middle Overs (7-15)</option>
                        <option value="Death">Death Overs (16-20)</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label>Venue</label>
                    <select id="filterVenue">
                        <option value="All">All Venues</option>
                    </select>
                </div>
                
                <div class="filter-group" style="margin-top: 2rem;">
                    <button onclick="fetchStats()" style="width: 100%; padding: 1rem; border-radius: 12px; border: none; background: var(--accent-gradient); color: white; font-family: 'Outfit'; font-weight: 600; font-size: 1.1rem; cursor: pointer;">
                        Apply Filters
                    </button>
                </div>
            </div>

            <!-- Stats Display -->
            <div>
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div>
                </div>
            </div>
        </div>
        
        <script>
            const athleteId = "{{ athlete_id }}";
            
            // Load filters and initial stats
            async function init() {
                try {
                    // Fetch metadata
                    const playerRes = await fetch(`/api/athlete/${athleteId}`);
                    if(playerRes.ok) {
                        const player = await playerRes.json();
                        document.getElementById('playerHeader').innerHTML = `
                            <h2>${player.full_name}</h2>
                            <span style="background: var(--surface-color); padding: 0.5rem 1rem; border-radius: 100px; color: var(--text-secondary);">${player.country_code || 'Unknown'}</span>
                        `;
                    }
                    
                    // Initialize dynamic filters
                    await fetchDynamicFilters();
                    
                    // Also fetch opponents globally (since opponent isn't dynamic in backend yet)
                    const globalRes = await fetch('/api/filters');
                    if (globalRes.ok) {
                        const globalData = await globalRes.json();
                        const oppSelect = document.getElementById('filterOpponent');
                        oppSelect.innerHTML = '<option value="All">All Opponents</option>' + globalData.opponents.map(o => `<option value="${o}">${o}</option>`).join('');
                    }
        
                    
                    fetchStats();
                } catch(e) {
                    console.error("Initialization failed", e);
                }
            }
            
            
            async function fetchDynamicFilters(sourceId = null) {
                const formatSelect = document.getElementById('filterFormat');
                const leagueSelect = document.getElementById('filterLeague');
                const venSelect = document.getElementById('filterVenue');
                const phaseSelect = document.getElementById('filterPhase');
                
                const currentFormat = formatSelect.value || 'All';
                const currentLeague = leagueSelect.value || 'All';
                const currentVenue = venSelect.value || 'All';
                const currentPhase = phaseSelect.value || 'All';
                
                try {
                    const params = new URLSearchParams({
                        id: athleteId,
                        format: currentFormat,
                        league: currentLeague,
                        venue: currentVenue,
                        phase: currentPhase
                    });
                    
                    const filterRes = await fetch(`/api/batter_filters?${params.toString()}`);
                    if(filterRes.ok) {
                        const filters = await filterRes.json();
                        
                        if (sourceId !== 'filterFormat') {
                            formatSelect.innerHTML = '<option value="All">All Formats</option>' + filters.formats.map(f => `<option value="${f}">${f}</option>`).join('');
                            if (filters.formats.includes(currentFormat)) formatSelect.value = currentFormat;
                        }
                        
                        if (sourceId !== 'filterLeague') {
                            leagueSelect.innerHTML = '<option value="All">All Leagues</option>' + filters.leagues.map(l => `<option value="${l}">${l}</option>`).join('');
                            if (filters.leagues.includes(currentLeague)) leagueSelect.value = currentLeague;
                        }
                        
                        if (sourceId !== 'filterVenue') {
                            venSelect.innerHTML = '<option value="All">All Venues</option>' + filters.venues.map(v => `<option value="${v}">${v}</option>`).join('');
                            if (filters.venues.includes(currentVenue)) venSelect.value = currentVenue;
                        }
                    }
                } catch(e) {
                    console.error("Failed to fetch dynamic filters", e);
                }
            }

            document.getElementById('filterFormat').addEventListener('change', () => fetchDynamicFilters('filterFormat'));
            document.getElementById('filterLeague').addEventListener('change', () => fetchDynamicFilters('filterLeague'));
            document.getElementById('filterVenue').addEventListener('change', () => fetchDynamicFilters('filterVenue'));
            document.getElementById('filterPhase').addEventListener('change', () => fetchDynamicFilters('filterPhase'));

            async function fetchStats() {
                document.getElementById('statsGrid').innerHTML = '<div class="stat-card"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div>';
                
                const params = new URLSearchParams({
                    id: athleteId,
                    format: document.getElementById('filterFormat').value,
                    league: document.getElementById('filterLeague').value,
                    opponent: document.getElementById('filterOpponent').value,
                    phase: document.getElementById('filterPhase').value,
                    venue: document.getElementById('filterVenue').value
                });
                
                try {
                    const res = await fetch(`/api/stats/batter?${params.toString()}`);
                    const data = await res.json();
                    
                    document.getElementById('statsGrid').innerHTML = `
                        <div class="stat-card">
                            <i class="fas fa-baseball-bat-ball"></i>
                            <h3>Runs Scored</h3>
                            <p>${data.runs}</p>
                        </div>
                        <div class="stat-card">
                            <i class="fas fa-bolt"></i>
                            <h3>Strike Rate</h3>
                            <p>${data.sr}</p>
                        </div>
                        <div class="stat-card">
                            <i class="fas fa-star"></i>
                            <h3>Highest Score</h3>
                            <p>${data.hs}</p>
                        </div>
                        <div class="stat-card">
                            <i class="fas fa-fire"></i>
                            <h3>Sixes</h3>
                            <p>${data.sixes}</p>
                        </div>
                        <div class="stat-card">
                            <i class="fas fa-stop-circle"></i>
                            <h3>Dot Ball %</h3>
                            <p>${data.dot_pct}%</p>
                        </div>
                        <div class="stat-card">
                            <i class="fas fa-hashtag"></i>
                            <h3>Balls Faced</h3>
                            <p>${data.balls}</p>
                        </div>
                    `;
                } catch(e) {
                    console.error("Failed to fetch stats", e);
                    document.getElementById('statsGrid').innerHTML = '<p>Error loading stats.</p>';
                }
            }
            
            init();
        </script>
        {% endif %}
    </div>
</body>
</html>
