<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICC Pitch Map Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
        }
    </style>
</head>
<body class="min-h-screen p-8">

    <div class="max-w-7xl mx-auto space-y-8">
        
        <header class="text-center space-y-2">
            <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                ICC Pitch Map Analytics
            </h1>
            <p class="text-slate-400">Advanced Ball Tracking & Line/Length Visualization</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <!-- Filters -->
            <div class="glass-panel p-6 lg:col-span-1 space-y-6">
                <h3 class="text-xl font-semibold border-b border-slate-700 pb-2">Filters</h3>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Bowler Name</label>
                        <input type="text" id="bowlerFilter" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500" placeholder="e.g. Bumrah">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Batsman Name</label>
                        <input type="text" id="batsmanFilter" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500" placeholder="e.g. Kohli">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Venue</label>
                        <input type="text" id="venueFilter" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500" placeholder="e.g. Wankhede">
                    </div>
                    
                    <button onclick="fetchData()" class="w-full bg-gradient-to-r from-blue-500 to-emerald-500 hover:from-blue-600 hover:to-emerald-600 text-white font-semibold py-3 px-4 rounded-xl transition-all shadow-lg shadow-blue-500/20">
                        Generate Pitch Map
                    </button>
                </div>
            </div>

            <!-- Chart -->
            <div class="glass-panel p-6 lg:col-span-3 flex flex-col items-center justify-center min-h-[600px] relative">
                <div id="loading" class="absolute inset-0 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm rounded-xl hidden z-10">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-400"></div>
                </div>
                
                <h2 class="text-xl font-semibold mb-4 w-full text-left">Delivery Scatter Plot</h2>
                <div class="w-full h-full bg-[#1e293b] rounded-lg p-4 relative border border-slate-700 overflow-hidden">
                    <!-- Placeholder Pitch Graphic -->
                    <div class="absolute inset-0 m-12 border-2 border-emerald-900/50 bg-[#8b5a2b]/20 flex flex-col justify-between pointer-events-none">
                        <div class="border-b-2 border-slate-300/30 h-12 w-full"></div>
                        <div class="border-t-2 border-slate-300/30 h-12 w-full"></div>
                    </div>
                    <canvas id="pitchMapChart"></canvas>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        let scatterChart = null;

        async function fetchData() {
            document.getElementById('loading').classList.remove('hidden');
            
            const bowler = document.getElementById('bowlerFilter').value;
            const batsman = document.getElementById('batsmanFilter').value;
            const venue = document.getElementById('venueFilter').value;
            
            let url = `/api/stats/pitchmap_icc?is_wicket=false`;
            if (bowler) url += `&bowler=${encodeURIComponent(bowler)}`;
            if (batsman) url += `&batsman=${encodeURIComponent(batsman)}`;
            if (venue) url += `&venue=${encodeURIComponent(venue)}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                renderChart(data);
            } catch (err) {
                console.error("Failed to fetch pitch map data", err);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function renderChart(data) {
            const ctx = document.getElementById('pitchMapChart').getContext('2d');
            
            if (scatterChart) {
                scatterChart.destroy();
            }

            // Extract coordinates from ball_line_length CSV string
            // Based on ICC format "x1,y1,x2,y2,x3,y3"
            const points = data.map(ball => {
                const parts = ball.ball_line_length.split(',');
                if (parts.length >= 2) {
                    return {
                        x: parseFloat(parts[0]),
                        y: parseFloat(parts[1]),
                        raw: ball
                    };
                }
                return null;
            }).filter(p => p !== null && !isNaN(p.x) && !isNaN(p.y));

            scatterChart = new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [{
                        label: 'Deliveries',
                        data: points,
                        backgroundColor: 'rgba(52, 211, 153, 0.6)',
                        borderColor: 'rgb(52, 211, 153)',
                        borderWidth: 1,
                        pointRadius: 6,
                        pointHoverRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(ctx) {
                                    const ball = ctx.raw.raw;
                                    return [
                                        `Speed: ${ball.ball_speed || 'N/A'} kph`,
                                        `Bowler: ${ball.bowler_name}`,
                                        `Batsman: ${ball.batsman_name}`,
                                        `Wicket: ${ball.is_wicket ? 'Yes' : 'No'}`
                                    ];
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            title: { display: true, text: 'X Coordinate (Width)', color: '#94a3b8' },
                            ticks: { color: '#64748b' }
                        },
                        y: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            title: { display: true, text: 'Y Coordinate (Length)', color: '#94a3b8' },
                            ticks: { color: '#64748b' }
                        }
                    }
                }
            });
        }
        
        // Load initial data
        fetchData();
    </script>
</body>
</html>
