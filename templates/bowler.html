<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bowler Analytics | Cricket Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container fade-in">
        <header>
            <div class="logo">
                <a href="/" style="text-decoration: none;"><h1>Cricket Analytics</h1></a>
            </div>
            <div class="nav-links">
                <a href="/batter"><i class="fas fa-baseball-bat-ball"></i> Batter</a>
                <a href="/bowler" class="active"><i class="fas fa-bolt"></i> Bowler</a>
                <a href="/faceoff"><i class="fas fa-people-arrows"></i> Face-off</a>
            </div>
        </header>

        <div class="dashboard">
            <!-- Top Bar for Selection & Filters -->
            <div class="glass-panel" style="display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: flex-end; position: relative; z-index: 50;">
                <div style="flex: 2; min-width: 250px; position: relative;">
                    <label style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 0.5rem; display: block; font-weight: 600; text-transform: uppercase;"><i class="fas fa-user"></i> Select Bowler</label>
                    <input type="text" id="athleteSearch" placeholder="Search bowler..." autocomplete="off" style="width: 100%; padding: 0.8rem 1rem; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 0.95rem;">
                    <div id="searchResults" class="search-results"></div>
                </div>

                <div style="flex: 1; min-width: 150px;">
                    <label id="labelFormat" style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 0.5rem; display: block; font-weight: 600; text-transform: uppercase;">Format</label>
                    <select id="filterFormat" style="width: 100%; padding: 0.8rem 1rem; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 0.95rem;"><option value="All">All Formats</option></select>
                </div>
                
                <div style="flex: 1; min-width: 150px;">
                    <label id="labelLeague" style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 0.5rem; display: block; font-weight: 600; text-transform: uppercase;">League</label>
                    <select id="filterLeague" style="width: 100%; padding: 0.8rem 1rem; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 0.95rem;"><option value="All">All Leagues</option></select>
                </div>
                
                <div style="flex: 1; min-width: 150px;">
                    <label id="labelPhase" style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 0.5rem; display: block; font-weight: 600; text-transform: uppercase;">Phase</label>
                    <select id="filterPhase" style="width: 100%; padding: 0.8rem 1rem; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 0.95rem;">
                        <option value="All">All Phases</option>
                        <option value="Powerplay">Powerplay (1-6)</option>
                        <option value="Middle">Middle Overs (7-15)</option>
                        <option value="Death">Death Overs (16-20)</option>
                    </select>
                </div>
                
                <div style="flex: 1; min-width: 150px;">
                    <label id="labelVenue" style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 0.5rem; display: block; font-weight: 600; text-transform: uppercase;">Venue</label>
                    <select id="filterVenue" style="width: 100%; padding: 0.8rem 1rem; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 0.95rem;"><option value="All">All Venues</option></select>
                </div>
                
                <div style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 0.5rem;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; color: var(--text-primary); cursor: pointer; font-size: 0.85rem; font-weight: 600; text-transform: uppercase;">
                        <input type="checkbox" id="splitByFormat" style="width: 16px; height: 16px; cursor: pointer;"> Split Formats
                    </label>
                    <button onclick="fetchStats()" style="padding: 0.8rem 2rem; border-radius: 12px; border: none; background: var(--accent-gradient); color: white; font-family: 'Outfit'; font-weight: 600; font-size: 1.1rem; cursor: pointer; box-shadow: var(--neon-glow); transition: transform 0.2s;">
                        Analyze
                    </button>
                </div>
            </div>

            <!-- Stats Display -->
            <div>
                <div class="player-header">
                    <div class="glass-panel" style="display: inline-block; padding: 1.5rem 4rem;">
                        <a id="athleteProfileLink" href="#" style="text-decoration: none; color: inherit; display: block; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
                            <h2 class="player-name" id="athleteName" style="margin-bottom: 0;">?</h2>
                            <div style="font-size: 0.85rem; color: var(--accent-blue); margin-bottom: 0.5rem;"><i class="fas fa-external-link-alt"></i> View Full Profile</div>
                        </a>
                        <div style="color: var(--text-secondary); font-family: 'Outfit';">Career Bowling Overview</div>
                    </div>
                </div>
                
                <div id="loadingState">
                    <span class="loader"></span>
                    <p style="margin-top: 1rem; color: var(--text-secondary); font-family: 'Outfit';">Fetching Analytics...</p>
                </div>

                <div id="mainContent" style="display: none;">
                    <div class="bento-grid" id="statsGrid">
                        <!-- Basic Stats Injected Here -->
                    </div>

                    <div class="bento-grid" style="margin-top: 1.5rem;" id="chartsRow">
                        <!-- Pitching Heatmap -->
                        <div class="glass-panel span-2 chart-container" style="min-height: 350px;">
                            <div class="chart-header">
                                <h3 class="chart-title"><i class="fas fa-fire-alt" style="color: var(--accent-red);"></i> Pitching Heatmap</h3>
                            </div>
                            <div class="chart-wrapper">
                                <canvas id="heatmapChart"></canvas>
                            </div>
                        </div>

                        <!-- Wicket Types -->
                        <div class="glass-panel span-2 chart-container" style="min-height: 350px;">
                            <div class="chart-header">
                                <h3 class="chart-title"><i class="fas fa-skull" style="color: var(--accent-blue);"></i> Dismissal Methods</h3>
                            </div>
                            <div class="chart-wrapper">
                                <canvas id="wicketChart"></canvas>
                            </div>
                        </div>

                        <!-- Pace Profile -->
                        <div class="glass-panel span-4 chart-container" style="min-height: 300px;">
                            <div class="chart-header">
                                <h3 class="chart-title"><i class="fas fa-tachometer-alt" style="color: var(--accent-green);"></i> Pace Profile Curve</h3>
                            </div>
                            <div class="chart-wrapper">
                                <canvas id="paceChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div id="emptyState" style="text-align: center; padding: 4rem; color: var(--text-secondary);">
                    <i class="fas fa-search" style="font-size: 4rem; opacity: 0.3; margin-bottom: 1.5rem;"></i>
                    <h3 style="font-family: 'Outfit'; color: white;">Awaiting Selection</h3>
                    <p>Search and select a bowler to view their deep analytics.</p>
                </div>
            </div>
        </div>
        
        <script>
            let currentAthleteId = "{{ athlete_id or '' }}";
            let heatmapChartInstance = null;
            let wicketChartInstance = null;
            let paceChartInstance = null;
            
            Chart.defaults.color = '#94a3b8';
            Chart.defaults.font.family = "'Inter', sans-serif";
            
            async function init() {
                try {
                    const filterRes = await fetch(`/api/filters`);
                    if(filterRes.ok) {
                        const filters = await filterRes.json();
                        const formatSelect = document.getElementById('filterFormat');
                        formatSelect.innerHTML += filters.formats.map(f => `<option value="${f}">${f}</option>`).join('');
                        const leagueSelect = document.getElementById('filterLeague');
                        leagueSelect.innerHTML += filters.leagues.map(l => `<option value="${l}">${l}</option>`).join('');
                        const venSelect = document.getElementById('filterVenue');
                        venSelect.innerHTML += filters.venues.map(v => `<option value="${v}">${v}</option>`).join('');
                    }
                    
                    if (currentAthleteId) {
                        const bRes = await fetch(`/api/athlete/${currentAthleteId}`);
                        if (bRes.ok) document.getElementById('athleteName').textContent = (await bRes.json()).full_name;
                        await fetchBowlerFilters();
                        fetchStats();
                    }
                } catch(e) { console.error("Init failed", e); }
            }
            
            async function fetchBowlerFilters(sourceId = null) {
                let currentId = '';
                if ('Bowler' === 'Faceoff') {
                    if (!currentBatterId || !currentBowlerId) return;
                } else {
                    if (!currentAthleteId) return;
                    currentId = currentAthleteId;
                }
                
                const formatSelect = document.getElementById('filterFormat');
                const leagueSelect = document.getElementById('filterLeague');
                const venSelect = document.getElementById('filterVenue');
                const oppSelect = document.getElementById('filterOpponent');
                const bowlSelect = document.getElementById('filterBowlingType');
                const yearSelect = document.getElementById('filterYear');
                // phase, innings, result, recent are static or independent, but we send them
                
                const currentFormat = formatSelect ? formatSelect.value || 'All' : 'All';
                const currentLeague = leagueSelect ? leagueSelect.value || 'All' : 'All';
                const currentVenue = venSelect ? venSelect.value || 'All' : 'All';
                const currentOpp = oppSelect ? oppSelect.value || 'All' : 'All';
                const currentBowl = bowlSelect ? bowlSelect.value || 'All' : 'All';
                const currentYear = yearSelect ? yearSelect.value || 'All' : 'All';
                const currentInnings = document.getElementById('filterInnings') ? document.getElementById('filterInnings').value || 'All' : 'All';
                const currentResult = document.getElementById('filterResult') ? document.getElementById('filterResult').value || 'All' : 'All';
                const currentPhase = document.getElementById('filterPhase') ? document.getElementById('filterPhase').value || 'All' : 'All';
                const currentRecent = document.getElementById('filterRecent') ? document.getElementById('filterRecent').value || 'All' : 'All';
                
                try {
                    let params;
                    if ('Bowler' === 'Faceoff') {
                        params = new URLSearchParams({
                            batter_id: currentBatterId, bowler_id: currentBowlerId, format: currentFormat, league: currentLeague, venue: currentVenue,
                            opponent: currentOpp, bowling_type: currentBowl, innings: currentInnings, result: currentResult, year: currentYear, phase: currentPhase, recent: currentRecent
                        });
                    } else {
                        params = new URLSearchParams({
                            id: currentId, format: currentFormat, league: currentLeague, venue: currentVenue,
                            opponent: currentOpp, bowling_type: currentBowl, innings: currentInnings, result: currentResult, year: currentYear, phase: currentPhase, recent: currentRecent
                        });
                    }
                    
                    const endpoint = 'Bowler' === 'Batter' ? '/api/batter_filters' : ('Bowler' === 'Bowler' ? '/api/bowler_filters' : '/api/faceoff_filters');
                    const filterRes = await fetch(`${endpoint}?${params.toString()}`);
                    
                    if(filterRes.ok) {
                        const filters = await filterRes.json();
                        
                                                                        
                        if (sourceId !== 'filterFormat' && formatSelect && filters.formats) {
                            formatSelect.innerHTML = '<option value="All">All Formats</option>' + filters.formats.map(f => `<option value="${f}">${f}</option>`).join('');
                            if (filters.formats.includes(currentFormat)) formatSelect.value = currentFormat;
                        }
                        if (sourceId !== 'filterLeague' && leagueSelect && filters.leagues) {
                            leagueSelect.innerHTML = '<option value="All">All Leagues</option>' + filters.leagues.map(l => `<option value="${l}">${l}</option>`).join('');
                            if (filters.leagues.includes(currentLeague)) leagueSelect.value = currentLeague;
                        }
                        if (sourceId !== 'filterVenue' && venSelect && filters.venues) {
                            venSelect.innerHTML = '<option value="All">All Venues</option>' + filters.venues.map(v => `<option value="${v}">${v}</option>`).join('');
                            if (filters.venues.includes(currentVenue)) venSelect.value = currentVenue;
                        }
                        if (sourceId !== 'filterOpponent' && oppSelect && filters.opponents) {
                            oppSelect.innerHTML = '<option value="All">All Opponents</option>' + filters.opponents.map(o => `<option value="${o}">${o}</option>`).join('');
                            if (filters.opponents.includes(currentOpp)) oppSelect.value = currentOpp;
                        }
                        if (sourceId !== 'filterBowlingType' && bowlSelect && filters.bowling_types) {
                            bowlSelect.innerHTML = '<option value="All">All Types</option>' + filters.bowling_types.map(b => `<option value="${b}">${b}</option>`).join('');
                            if (filters.bowling_types.includes(currentBowl)) bowlSelect.value = currentBowl;
                        }
                        if (sourceId !== 'filterYear' && yearSelect && filters.years) {
                            yearSelect.innerHTML = '<option value="All">All Years</option>' + filters.years.map(y => `<option value="${y}">${y}</option>`).join('');
                            if (filters.years.includes(parseInt(currentYear)) || filters.years.includes(currentYear)) yearSelect.value = currentYear;
                        }
                    }
                } catch(e) { 
                    console.error(e); 
                }
            }

            document.getElementById('filterFormat').addEventListener('change', () => fetchBowlerFilters('filterFormat'));
            document.getElementById('filterLeague').addEventListener('change', () => fetchBowlerFilters('filterLeague'));
            document.getElementById('filterVenue').addEventListener('change', () => fetchBowlerFilters('filterVenue'));
            if(document.getElementById('filterOpponent')) document.getElementById('filterOpponent').addEventListener('change', () => fetchBowlerFilters('filterOpponent'));
            if(document.getElementById('filterBowlingType')) document.getElementById('filterBowlingType').addEventListener('change', () => fetchBowlerFilters('filterBowlingType'));
            if(document.getElementById('filterYear')) document.getElementById('filterYear').addEventListener('change', () => fetchBowlerFilters('filterYear'));
            if(document.getElementById('filterInnings')) document.getElementById('filterInnings').addEventListener('change', () => fetchBowlerFilters('filterInnings'));
            if(document.getElementById('filterResult')) document.getElementById('filterResult').addEventListener('change', () => fetchBowlerFilters('filterResult'));
            if(document.getElementById('filterPhase')) document.getElementById('filterPhase').addEventListener('change', () => fetchBowlerFilters('filterPhase'));
            if(document.getElementById('filterRecent')) document.getElementById('filterRecent').addEventListener('change', () => fetchBowlerFilters('filterRecent'));
            

                                                            if(document.getElementById('filterOpponent')) document.getElementById('filterOpponent').addEventListener('change', () => fetchBowlerFilters('filterOpponent'));
            if(document.getElementById('filterBowlingType')) document.getElementById('filterBowlingType').addEventListener('change', () => fetchBowlerFilters('filterBowlingType'));
            if(document.getElementById('filterYear')) document.getElementById('filterYear').addEventListener('change', () => fetchBowlerFilters('filterYear'));
            if(document.getElementById('filterInnings')) document.getElementById('filterInnings').addEventListener('change', () => fetchBowlerFilters('filterInnings'));
            if(document.getElementById('filterResult')) document.getElementById('filterResult').addEventListener('change', () => fetchBowlerFilters('filterResult'));
            if(document.getElementById('filterPhase')) document.getElementById('filterPhase').addEventListener('change', () => fetchBowlerFilters('filterPhase'));
            if(document.getElementById('filterRecent')) document.getElementById('filterRecent').addEventListener('change', () => fetchBowlerFilters('filterRecent'));

            function setupSearch() {
                const input = document.getElementById('athleteSearch');
                const results = document.getElementById('searchResults');
                let timeout;
                
                input.addEventListener('input', (e) => {
                    const query = e.target.value.trim();
                    clearTimeout(timeout);
                    if (query.length < 1) { results.classList.remove('active'); return; }
                    
                    results.innerHTML = '<div style="padding: 1rem; color: var(--text-secondary); text-align: center;"><i class="fas fa-spinner fa-spin"></i></div>';
                    results.classList.add('active');

                    timeout = setTimeout(async () => {
                        try {
                            const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                            const data = await response.json();
                            
                            if(data.length > 0) {
                                results.innerHTML = data.map(p => {
                                    const safeName = (p.full_name || '').replace(/'/g, "\\'");
                                    return `
                                    <div class="search-result-item" onclick="selectPlayer('${p.id}', '${safeName}')">
                                        <div style="font-weight: 600; font-family: 'Outfit'; color: white;">${p.full_name}</div>
                                        <div style="font-size: 0.8rem;">${p.country_code || 'Unknown'}</div>
                                    </div>`;
                                }).join('');
                            } else {
                                results.innerHTML = '<div style="padding: 1rem; text-align: center;">No players found</div>';
                            }
                        } catch (err) { results.innerHTML = '<div style="padding: 1rem; color: #ef4444; text-align: center;">Error</div>'; }
                    }, 300);
                });
                document.addEventListener('click', (e) => {
                    if (!input.contains(e.target) && !results.contains(e.target)) results.classList.remove('active');
                });
            }
            
            function selectPlayer(id, name) {
                currentAthleteId = id;
                document.getElementById('athleteName').textContent = name;
                document.getElementById('athleteProfileLink').href = `/player/${id}`;
                document.getElementById('athleteSearch').value = name;
                document.getElementById('searchResults').classList.remove('active');
                
                fetchBowlerFilters();
                
                const url = new URL(window.location);
                url.searchParams.set('id', id);
                window.history.pushState({}, '', url);
            }
            
            function initCharts(data) {
                // Pitching Heatmap
                const heatmapCtx = document.getElementById('heatmapChart').getContext('2d');
                if (heatmapChartInstance) heatmapChartInstance.destroy();
                
                heatmapChartInstance = new Chart(heatmapCtx, {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(data.heatmap_data || {}),
                        datasets: [{
                            data: Object.values(data.heatmap_data || {}),
                            backgroundColor: ['#ef4444', '#f59e0b', '#10b981', '#3b82f6'],
                            borderWidth: 0
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { position: 'right', labels: { color: '#f8fafc', font: { family: 'Inter' } } } } }
                });

                // Wicket Types
                const wicketCtx = document.getElementById('wicketChart').getContext('2d');
                if (wicketChartInstance) wicketChartInstance.destroy();
                
                wicketChartInstance = new Chart(wicketCtx, {
                    type: 'bar',
                    data: {
                        labels: Object.keys(data.wicket_data || {}),
                        datasets: [{
                            label: 'Dismissals',
                            data: Object.values(data.wicket_data || {}),
                            backgroundColor: 'rgba(59, 130, 246, 0.8)',
                            borderRadius: 4
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' } }, x: { grid: { display: false } } } }
                });

                // Pace Profile Curve
                const paceCtx = document.getElementById('paceChart').getContext('2d');
                if (paceChartInstance) paceChartInstance.destroy();
                
                paceChartInstance = new Chart(paceCtx, {
                    type: 'line',
                    data: {
                        labels: Object.keys(data.pace_data || {}),
                        datasets: [{
                            label: 'Deliveries',
                            data: Object.values(data.pace_data || {}),
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.2)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' } }, x: { grid: { color: 'rgba(255,255,255,0.05)' } } }, elements: { point: { radius: 0, hitRadius: 10, hoverRadius: 6 } } }
                });
            }

            async function fetchStats() {
                if (!currentAthleteId) return;
                
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('loadingState').style.display = 'flex';
                
                const splitMode = document.getElementById('splitByFormat').checked;
                
                const baseParams = new URLSearchParams({
                    id: currentAthleteId,
                    league: document.getElementById('filterLeague').value,
                    phase: document.getElementById('filterPhase').value,
                    venue: document.getElementById('filterVenue').value
                });
                
                try {
                    document.getElementById('mainContent').style.display = 'block';
                    
                    if (splitMode) {
                        document.getElementById('chartsRow').style.display = 'none';
                        document.getElementById('statsGrid').className = '';
                        
                        const formats = ['Test', 'ODI', 'T20I', 'T20'];
                        let html = '';
                        
                        for (let fmt of formats) {
                            baseParams.set('format', fmt);
                            const res = await fetch(`/api/stats/bowler?${baseParams.toString()}`);
                            const data = await res.json();
                            
                            if (data.wickets > 0 || data.balls_bowled > 0) {
                                html += `
                                <h3 style="margin-top: 2rem; margin-bottom: 1rem; color: var(--accent-blue); display:flex; align-items:center; gap:0.5rem;"><i class="fas fa-trophy"></i> ${fmt} Breakdown</h3>
                                <div class="bento-grid">
                                    <div class="glass-panel stat-box">
                                        <div class="stat-label">Wickets</div>
                                        <div class="stat-value" style="color: var(--accent-blue); background: none; -webkit-text-fill-color: var(--accent-blue);">${data.wickets}</div>
                                    </div>
                                    <div class="glass-panel stat-box">
                                        <div class="stat-label">Economy</div>
                                        <div class="stat-value small">${data.eco}</div>
                                        <div class="stat-subtext">Runs/Over</div>
                                    </div>
                                    <div class="glass-panel stat-box">
                                        <div class="stat-label">Average</div>
                                        <div class="stat-value small">${data.avg}</div>
                                        <div class="stat-subtext">Runs/Wicket</div>
                                    </div>
                                    <div class="glass-panel stat-box">
                                        <div class="stat-label">Best Bowling</div>
                                        <div class="stat-value" style="font-size: 2rem;">${data.best}</div>
                                    </div>
                                </div>
                                `;
                            }
                        }
                        
                        if (html === '') {
                            html = '<div style="text-align:center; padding: 3rem; color: var(--text-secondary); background: rgba(0,0,0,0.2); border-radius: 12px;"><i class="fas fa-ghost" style="font-size: 2rem; margin-bottom: 1rem; display:block;"></i>No historical data found for the selected filters.</div>';
                        }
                        
                        document.getElementById('statsGrid').innerHTML = html;
                        document.getElementById('loadingState').style.display = 'none';
                        
                    } else {
                        document.getElementById('chartsRow').style.display = 'grid';
                        document.getElementById('statsGrid').className = 'bento-grid';
                        baseParams.set('format', document.getElementById('filterFormat').value);
                        
                        const res = await fetch(`/api/stats/bowler?${baseParams.toString()}`);
                        const data = await res.json();
                        
                        document.getElementById('statsGrid').innerHTML = `
                            <div class="glass-panel stat-box">
                                <div class="stat-label">Wickets</div>
                                <div class="stat-value" style="color: var(--accent-blue); background: none; -webkit-text-fill-color: var(--accent-blue);">${data.wickets}</div>
                            </div>
                            <div class="glass-panel stat-box">
                                <div class="stat-label">Economy</div>
                                <div class="stat-value small">${data.eco}</div>
                                <div class="stat-subtext">Runs/Over</div>
                            </div>
                            <div class="glass-panel stat-box">
                                <div class="stat-label">Average</div>
                                <div class="stat-value small">${data.avg}</div>
                                <div class="stat-subtext">Runs/Wicket</div>
                            </div>
                            <div class="glass-panel stat-box">
                                <div class="stat-label">Best Bowling</div>
                                <div class="stat-value" style="font-size: 2rem;">${data.best}</div>
                            </div>
                        `;
                        
                        initCharts(data);
                        document.getElementById('loadingState').style.display = 'none';
                    }
                    
                } catch(e) {
                    console.error(e);
                    document.getElementById('loadingState').style.display = 'none';
                    document.getElementById('emptyState').style.display = 'block';
                    document.getElementById('emptyState').innerHTML = '<p style="color:var(--accent-red);">Failed to load bowler data.</p>';
                }
            }
            
            setupSearch();
            init();
        </script>
    </div>
</body>
</html>
