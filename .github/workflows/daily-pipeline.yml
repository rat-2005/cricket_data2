name: Daily Cricket Data Pipeline

on:
  schedule:
    # 21:30 UTC is 3:00 AM IST
    - cron: '30 21 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

permissions:
  contents: write # Needed to push events.json back to the repo

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: 1. Fetch Data (Discover new matches)
        run: python fetch_data.py
        
      - name: 2. Download from S3 to initialize compaction baseline
        # We need the old data_merged to append to it!
        # Instead of downloading everything, we just need the merged files.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          # First download the existing merged files from S3 so we can append to them
          # We can use AWS CLI since it's pre-installed on GitHub Actions Ubuntu runners
          aws s3 sync s3://cricket-telemetry-lake-thej/data_merged data_merged/

      - name: 3. Scrape Cricinfo (New matches only)
        run: python scripts/bulk_cricinfo_scraper.py

      - name: 4. Download & Convert Cricsheet
        run: python scripts/convert_cricsheet_to_parquet.py

      - name: 5. Incremental Compaction
        run: python scripts/incremental_compact.py

      - name: 6. Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: python scripts/upload_to_s3.py

      - name: 7. Commit updated events.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add events.json leagues.json
          git commit -m "Auto-update events.json [skip ci]" || echo "No changes to commit"
          git push
