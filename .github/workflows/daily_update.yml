name: Daily Data ETL Pipeline

# Run daily at 12:00 AM UTC
on:
  schedule:
    - cron: '0 0 * * *'
  # Allows you to trigger this workflow manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  update-cricket-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ---------------------------------------------------------
      # EDIT THIS SECTION: Put your actual data ingestion command here
      # ---------------------------------------------------------
      - name: Run Data Scraper & Update Parquet
        run: |
          # E.g., python ingest_cricsheet.py
          python ingest.py 
        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Change to your bucket's region

      - name: Sync updated Parquet files to S3
        run: |
          # Syncs your newly created/updated local Parquet files up to your S3 bucket
          # Replace 'cricinfo_parquet/data.parquet' and bucket name as needed
          aws s3 sync ./data/ s3://cricket-telemetry-lake-thej/data/ --exclude "*" --include "*.parquet"
